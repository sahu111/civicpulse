[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = tests
# The browser test runs separately: pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: browser end-to-end tests (need: playwright install chromium)
filterwarnings =
    ignore:No directory at:UserWarning
