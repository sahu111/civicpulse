{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CivicPulse{% endblock %} · CivicPulse</title>
  <link rel="icon" href="{% static 'vendor/icons/activity.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body class="h-full bg-canvas font-sans text-slate-800 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "partials/toasts.html" %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
