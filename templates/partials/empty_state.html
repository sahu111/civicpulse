{% load ui %}
{# Usage: {% include "partials/empty_state.html" with icon_name="inbox" title="..." text="..." action_url="..." action_label="..." %} #}
<div class="flex flex-col items-center justify-center px-6 py-12 text-center">
  <span class="mb-3 grid size-12 place-items-center rounded-full bg-indigo-50 text-indigo-600">{% icon icon_name|default:"inbox" "size-6" %}</span>
  <h3 class="text-sm font-semibold text-slate-900">{{ title }}</h3>
  {% if text %}<p class="mt-1 max-w-sm text-sm text-slate-500">{{ text }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn-primary mt-4">{{ action_label }}</a>{% endif %}
</div>
