<div class="{{ wrap|default:'' }}">
  <label for="{{ field.id_for_label }}" class="label">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-slate-400">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="mt-1 text-xs text-slate-500">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>
